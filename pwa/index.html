<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        const metaScheme = document.querySelector('meta[name="color-scheme"]');
        if (metaScheme && (storedScheme === 'light' || storedScheme === 'dark')) {
          metaScheme.content = storedScheme;
        }
      } catch {}
    </script>
    <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UnB Pocket" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Cardápio e saldo do RU, horários e Turma Virtual do SIGAA, rendimento acadêmico, documentos oficiais e passe QR da UnB."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>UnB Pocket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
